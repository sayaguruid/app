<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>29 Karakter Luhur</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= RESET & VARIABLES ================= */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#00A8FF;--primary-light:#E6F6FF;--primary-dark:#0084C7;
  --text-dark:#1E1E1E;--text-gray:#888;--bg-body:#F5F7FA;--white:#FFF;
  --danger:#FF4757;--success:#2ED573;--border:#EEEEEE;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-pill:50px;
  --shadow:0 8px 24px rgba(0,168,255,.15);
  --shadow-sm:0 2px 10px rgba(0,0,0,.04);
  --nav-h:70px;
}
html,body{height:100%}
body{background:var(--bg-body);color:var(--text-dark);min-height:100vh;overflow-x:hidden}

/* ================= ICONS ================= */
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-sm{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-lg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ============================================================
   MOBILE FIRST  (default < 768px)
   ============================================================ */
.app-container{
  width:100%;max-width:100%;background:var(--white);
  min-height:100vh;position:relative;display:flex;flex-direction:column
}

/* ---------- LOGIN ---------- */
#view-login{
  padding:32px 22px;display:flex;flex-direction:column;justify-content:center;
  min-height:100vh;text-align:center
}
.login-image-container{width:100%;height:170px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}
.login-image-container img{max-width:100%;max-height:100%;object-fit:contain}
#view-login h1{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:8px}
#view-login p{font-size:13px;color:var(--text-gray);margin-bottom:24px;line-height:1.6;max-width:340px;margin-left:auto;margin-right:auto}
.input-group{text-align:left;margin-bottom:14px}
.input-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;margin-left:4px}
.input-group input{
  width:100%;padding:15px 18px;border:1.5px solid var(--border);border-radius:var(--radius-md);
  font-size:14px;background:#F9F9F9;transition:.2s
}
.input-group input:focus{border-color:var(--primary);background:#FFF;outline:none}
.btn-primary{
  width:100%;padding:15px;background:var(--primary);color:#FFF;border:none;border-radius:var(--radius-pill);
  font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;min-height:52px
}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.7;cursor:not-allowed}

/* ---------- APP LAYOUT (mobile) ---------- */
#view-app{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.header{
  padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;background:var(--white);border-bottom:1px solid #F5F5F5;position:sticky;top:0;z-index:20
}
.header-title{font-size:18px;font-weight:700;margin-top:2px;line-height:1.2}
.header-sub{font-size:12px;color:var(--text-gray)}
.avatar-btn{
  width:44px;height:44px;border-radius:50%;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;color:var(--primary);
  cursor:pointer;border:none;flex-shrink:0;transition:.2s
}
.avatar-btn:active{transform:scale(.94)}
#tabContent{
  flex:1;overflow-y:auto;padding:16px 18px calc(var(--nav-h) + 24px);
  -webkit-overflow-scrolling:touch;min-height:0
}

/* ---------- MATERI LIST (mobile: 1 kolom) ---------- */
.materi-grid{display:grid;grid-template-columns:1fr;gap:12px}
.materi-card-item{
  background:var(--white);border-radius:var(--radius-lg);padding:16px;
  box-shadow:var(--shadow-sm);border:1.5px solid var(--border);
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s
}
.materi-card-item:active{transform:scale(.99);border-color:var(--primary)}
.materi-icon-box{
  width:46px;height:46px;border-radius:14px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0
}
.materi-icon-box svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.materi-info{flex:1;min-width:0}
.materi-info h4{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.materi-info p{font-size:12px;color:var(--text-gray);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.arrow-icon{color:#CCC;width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}

/* ---------- DETAIL MATERI ---------- */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;
  color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;padding:6px 0
}
.course-card{
  background:linear-gradient(135deg,#00D2FF 0%,#00A8FF 100%);
  border-radius:var(--radius-lg);padding:22px;color:#FFF;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.course-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}
.course-card .tag{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:var(--radius-pill);font-size:10px;display:inline-block;margin-bottom:10px}
.course-card h3{font-size:19px;margin-bottom:6px;font-weight:600;position:relative;z-index:1}
.white-card{
  background:var(--white);border-radius:var(--radius-lg);padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border)
}
.white-card h4{font-size:14px;margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.white-card p{font-size:13px;color:var(--text-gray);line-height:1.6;text-align:justify}
.video-container{border-radius:12px;overflow:hidden;margin:10px 0;aspect-ratio:16/9;background:#000}
.video-container iframe{width:100%;height:100%;border:none;display:block}

/* ---------- TABEL PRAKTIK ---------- */
.praktik-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;border-radius:12px;overflow:hidden;table-layout:fixed}
.praktik-table th{background:#F8F9FA;padding:9px;text-align:left;border-bottom:1px solid var(--border);font-size:11px}
.praktik-table td{padding:9px;border-bottom:1px solid var(--border);vertical-align:top;word-wrap:break-word}
.praktik-table td.salah{color:var(--danger);background:#FFF5F5}
.praktik-table td.benar{color:var(--success);background:#F0FFF4}

/* ---------- DALIL (VERTIKAL) ---------- */
.dalil-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.dalil-card{background:#F8FBFF;border:1px solid #E6F2FF;border-radius:14px;padding:16px;position:relative}
.dalil-card .dalil-num{
  position:absolute;top:-8px;left:12px;background:var(--primary);color:#FFF;
  font-size:10px;font-weight:700;padding:2px 9px;border-radius:var(--radius-pill)
}
.dalil-card .dalil-arab{
  text-align:right;direction:rtl;font-size:20px;line-height:2;
  font-family:'Traditional Arabic','Amiri',serif;color:var(--text-dark);
  padding:6px 0;word-wrap:break-word;overflow-wrap:break-word
}
.dalil-card .dalil-divider{height:1px;background:linear-gradient(90deg,transparent,#D6E9F8,transparent);margin:10px 0}
.dalil-card .dalil-arti{font-size:12.5px;color:var(--text-gray);font-style:italic;line-height:1.7;text-align:left}
.dalil-card .dalil-arti::before{content:'\201C';color:var(--primary);font-weight:700;font-style:normal;margin-right:2px}
.dalil-card .dalil-arti::after{content:'\201D';color:var(--primary);font-weight:700;font-style:normal;margin-left:2px}

/* ---------- FONT CONTROL ---------- */
.font-control{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-shrink:0}
.font-btn{
  width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #DDD;border-radius:8px;background:#FFF;color:var(--text-dark);
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s
}
.font-btn:active{transform:scale(.94);background:var(--primary-light);border-color:var(--primary)}

/* ---------- SELECT JENJANG (PREMIUM) ---------- */
.select-wrap{position:relative;margin-bottom:14px}
.select-wrap .select-icon{
  position:absolute;
  left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;
  color:var(--primary);
  pointer-events:none;
  z-index:1;
}
.select-wrap select{
  width:100%;
  padding:14px 44px 14px 44px;
  border:1.5px solid #E0EDF7;
  border-radius:14px;
  font-size:13px;font-weight:500;
  color:var(--text-dark);
  background-color:#F5FAFF;
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  cursor:pointer;transition:all .2s ease;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2300A8FF' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right 16px center;
  background-size:16px;
  box-shadow:0 1px 3px rgba(0,168,255,.04);
  outline:none;
}
.select-wrap select:hover{border-color:#B8DDF7;background-color:#F0F8FF}
.select-wrap select:focus{
  border-color:var(--primary);background-color:#FFF;
  box-shadow:0 0 0 4px rgba(0,168,255,.12);
}
.select-wrap select:invalid,
.select-wrap select option[value=""]{color:var(--text-gray)}
.select-wrap select option{padding:10px;color:var(--text-dark);background:#FFF}

/* ---------- EVALUASI ---------- */
.eval-section{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--border)}
.eval-list{display:flex;flex-direction:column;gap:8px}
.eval-item{display:flex;justify-content:space-between;align-items:center;background:#F8F9FA;padding:10px 12px;border-radius:12px;gap:8px}
.eval-item .name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eval-item .actions{display:flex;gap:6px;flex-shrink:0}

/* ---------- BUTTON SMALL ---------- */
.btn-sm{
  padding:8px 14px;border:none;border-radius:var(--radius-pill);font-size:11px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:32px;white-space:nowrap;line-height:1;transition:.15s
}
.btn-sm:active{transform:scale(.95)}
.btn-sudah{background:var(--success);color:#FFF}
.btn-belum{background:#FFEAA7;color:#D63031}
.btn-outline{background:#FFF;border:1.5px solid #DDD;color:var(--text-gray)}

/* ---------- PROGRESS ---------- */
.progress-bar{background:#EEE;border-radius:10px;height:8px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .4s ease}

/* ---------- BOTTOM NAV (mobile) ---------- */
.bottom-nav{
  position:fixed;bottom:12px;left:12px;right:12px;background:var(--white);
  border-radius:var(--radius-pill);display:flex;justify-content:space-around;align-items:center;
  padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.12);border:1px solid var(--border);z-index:30
}
.bottom-nav button{
  background:none;border:none;color:var(--text-gray);cursor:pointer;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s;
  position:relative;flex:1;min-width:0;border-radius:12px
}
.bottom-nav button span{font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button.active::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;background:var(--primary);border-radius:50%}

/* ---------- SIDEBAR (hidden on mobile) ---------- */
.sidebar{display:none}

/* ---------- TOAST & UTILS ---------- */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--text-dark);color:#FFF;padding:12px 22px;border-radius:var(--radius-pill);
  font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);
  animation:fadeInDown .3s ease;max-width:calc(100vw - 32px);text-align:center
}
.toast.error{background:var(--danger)}
@keyframes fadeInDown{from{top:-50px;opacity:0}to{top:20px;opacity:1}}
.hidden{display:none!important}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* ---------- FORM ---------- */
.form-control{
  width:100%;padding:12px 15px;border:1.5px solid #E0E0E0;border-radius:12px;
  font-size:13px;margin-bottom:10px;background:#FAFAFA;transition:.15s
}
.form-control:focus{border-color:var(--primary);outline:none;background:#FFF}

/* ---------- TABLE ---------- */
.table-responsive{overflow-x:auto;width:100%;margin-top:8px;-webkit-overflow-scrolling:touch}
table.data-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:500px}
table.data-table th,table.data-table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
table.data-table th{background:#F8F9FA;font-weight:600}

/* ---------- DYNAMIC FORM ROWS ---------- */
.dynamic-list{margin-bottom:6px}
.dynamic-row textarea{resize:vertical}
.dynamic-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.dynamic-row > textarea{flex:1;margin-bottom:0}
.dynamic-row .remove-btn{flex-shrink:0;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center}
.form-row-2{display:grid;grid-template-columns:1fr;gap:10px}

/* ---------- RESPONSIVE: HP KECIL ---------- */
@media (max-width:380px){
  .header-title{font-size:16px}
  .materi-info h4{font-size:13px}
  .btn-sm{padding:7px 10px;font-size:10px;min-height:30px}
  .eval-item{padding:9px 10px}
  .bottom-nav button span{font-size:9px}
  .dalil-card{padding:14px}
  .dalil-card .dalil-arab{font-size:18px}
  #tabContent{padding:14px 14px calc(var(--nav-h) + 20px)}
  .header{padding:14px 16px 10px}
}

/* ============================================================
   TABLET  (≥ 768px)
   ============================================================ */
@media (min-width:768px){
  body{background:linear-gradient(135deg,#EAF6FF 0%,#F5F7FA 100%);padding:20px}
  .app-container{
    max-width:900px;margin:0 auto;min-height:calc(100vh - 40px);
    border-radius:24px;box-shadow:0 20px 60px rgba(0,168,255,.12);overflow:hidden
  }
  #view-login{min-height:calc(100vh - 40px)}
  #tabContent{padding:20px 24px calc(var(--nav-h) + 24px)}
  .materi-grid{grid-template-columns:1fr 1fr}
  .form-row-2{grid-template-columns:1fr 1fr}
  .header{padding:20px 24px 14px}
  .header-title{font-size:20px}
  .white-card{padding:22px}
  .bottom-nav{left:20px;right:20px;bottom:16px}
}

/* ============================================================
   DESKTOP  (≥ 1024px)  — WIDE LAYOUT DENGAN SIDEBAR
   ============================================================ */
@media (min-width:1024px){
  body{padding:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .app-container{
    max-width:1240px;width:100%;height:calc(100vh - 48px);
    border-radius:20px;display:flex;flex-direction:row;overflow:hidden;
    box-shadow:0 24px 80px rgba(0,168,255,.15)
  }

  /* --- LOGIN desktop --- */
  #view-login{
    flex-direction:row;align-items:center;gap:60px;padding:60px 80px;
    min-height:auto;text-align:left;width:100%;height:100%
  }
  #view-login .login-image-container{height:auto;width:45%;margin-bottom:0;order:2}
  #view-login .login-image-container img{max-width:340px}
  #view-login h1,#view-login p{margin-left:0}
  #view-login h1{font-size:34px}
  #view-login p{font-size:14px;margin-bottom:32px}
  .login-form-wrap{width:55%;max-width:400px;order:1}

  /* --- APP desktop: sidebar + main --- */
  #view-app{
    display:flex;flex-direction:row;width:100%;height:100%;
    min-height:0;max-height:100%;overflow:hidden
  }

  /* Sidebar */
  .sidebar{
    display:flex;flex-direction:column;width:240px;flex-shrink:0;
    background:#FAFCFF;border-right:1px solid var(--border);
    padding:24px 16px;overflow-y:auto
  }
  .sidebar-brand{
    display:flex;align-items:center;gap:10px;padding:6px 10px 22px;
    border-bottom:1px solid var(--border);margin-bottom:16px
  }
  .sidebar-brand .brand-logo{
    width:38px;height:38px;border-radius:10px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;color:#FFF;flex-shrink:0
  }
  .sidebar-brand .brand-text{font-size:15px;font-weight:700;line-height:1.2}
  .sidebar-brand .brand-sub{font-size:10px;color:var(--text-gray);font-weight:400}

  .sidebar-user{
    display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--white);
    border-radius:12px;border:1px solid var(--border);margin-bottom:16px
  }
  .sidebar-user .avatar-sm{
    width:36px;height:36px;border-radius:50%;background:var(--primary-light);
    display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0
  }
  .sidebar-user .u-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar-user .u-sub{font-size:10px;color:var(--text-gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sidebar-nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .sidebar-nav button{
    display:flex;align-items:center;gap:12px;padding:11px 14px;
    background:none;border:none;border-radius:10px;color:var(--text-gray);
    font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:.15s;width:100%
  }
  .sidebar-nav button:hover{background:var(--primary-light);color:var(--primary)}
  .sidebar-nav button.active{background:var(--primary);color:#FFF;font-weight:600}
  .sidebar-nav button.active .icon{stroke:#FFF}

  /* Main area — WAJIB min-height:0 agar scroll anak aktif */
  .main-area{
    flex:1;display:flex;flex-direction:column;
    min-width:0;min-height:0;height:100%;overflow:hidden
  }
  .header{display:none}
  #tabContent{
    padding:32px 40px 40px;flex:1;
    overflow-y:auto;overflow-x:hidden;
    min-height:0;height:100%;
    scroll-behavior:smooth
  }
  .bottom-nav{display:none}

  /* Materi grid 3 kolom */
  .materi-grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .materi-card-item{padding:18px;flex-direction:column;align-items:flex-start;gap:12px;position:relative}
  .materi-card-item .arrow-icon{position:absolute;top:18px;right:18px}
  .materi-icon-box{width:50px;height:50px;border-radius:14px}
  .materi-info{width:100%}
  .materi-info h4{font-size:15px;white-space:normal;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .materi-info p{font-size:12px;-webkit-line-clamp:2}

  /* Detail 2 kolom */
  .detail-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  .detail-main{min-width:0}
  .detail-side{position:sticky;top:0}

  /* Course card lebih besar */
  .course-card{padding:32px}
  .course-card h3{font-size:24px}
  .white-card{padding:24px;margin-bottom:18px}
  .white-card h4{font-size:15px}

  /* Admin form 2 kolom */
  .form-row-2{grid-template-columns:1fr 1fr;gap:14px}

  /* Table lega */
  table.data-table{min-width:auto;font-size:13px}
  table.data-table th,table.data-table td{padding:12px 14px}

  /* Dalil card lebih lega */
  .dalil-card{padding:20px 22px}
  .dalil-card .dalil-arab{font-size:24px;line-height:2.1}
  .dalil-card .dalil-arti{font-size:13px}

  /* Rekap grid */
  .rekap-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  /* Eval item lebih lega */
  .eval-item{padding:12px 16px}
  .eval-item .name{font-size:14px}
  .btn-sm{padding:8px 16px;font-size:12px;min-height:34px}

  /* Hover effects desktop */
  .materi-card-item:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 8px 20px rgba(0,168,255,.15)}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-sm:hover{opacity:.9}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
  .font-btn:hover{border-color:var(--primary);color:var(--primary)}
}

/* ============================================================
   LARGE DESKTOP (≥ 1400px)
   ============================================================ */

<script>
// ============================================================
// KONFIGURASI — GANTI URL DI BAWAH INI
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxkb8y8why7CV8G66HlPtiFSTXLq6_3CNH1F6QqFYeNr3Iq2y_qpH2IOhOEQ6rYV3AViw/exec';

// ============================================================
// STATE
// ============================================================
let state = { user:null, karakter:[], generus:[], evaluasi:[], rekap:null, activeMateri:null };
let editingKarakter = null;
let loading = false;

// ============================================================
// API HELPER
// ============================================================
async function api(action, payload = {}, opts = {}) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), opts.timeout || 25000);
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    clearTimeout(timeoutId);
    toast('Koneksi gagal: ' + err.message, true);
    return { success:false, message: err.message };
  }
}

function toast(msg, isError = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toEmbed(url) {
  if (!url) return '';
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : url;
}

// ============================================================
// LOGIN
// ============================================================
async function doLogin() {
  if (loading) return;
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { toast('Username & Password wajib diisi', true); return; }

  const btn = document.getElementById('btnLogin');
  loading = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div> Memuat...';
  btn.disabled = true;

  const r = await api('login', { username, password });

  loading = false;
  btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Masuk';
  btn.disabled = false;

  if (r.success) {
    state.user = r.user;

    // header (mobile)
    document.getElementById('userInfo').textContent = r.user.nama || r.user.username;
    let subText = 'Admin Pusat';
    if (r.user.role === 'kelompok') subText = r.user.kelompok || r.user.lokasi || 'Kelompok';
    if (r.user.role === 'desa')     subText = r.user.desa || 'Desa';
    if (r.user.role === 'daerah')   subText = r.user.daerah || r.user.lokasi || 'Daerah';
    document.getElementById('headerSub').textContent = subText;

    // sidebar (desktop)
    document.getElementById('sidebarName').textContent = r.user.nama || r.user.username;
    document.getElementById('sidebarSub').textContent = subText;

    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-app').classList.remove('hidden');

    buildNavigation();
    await preloadAllData();
    switchTab('materi');
  } else {
    toast(r.message || 'Login gagal', true);
  }
}

document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

function logout() {
  if (!confirm('Keluar dari akun?')) return;
  state = { user:null, karakter:[], generus:[], evaluasi:[], rekap:null, activeMateri:null };
  editingKarakter = null;
  document.getElementById('view-login').classList.remove('hidden');
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ============================================================
// ⚡ PRELOAD — 1 round-trip
// ============================================================
async function preloadAllData() {
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;

  const r = await api('getAllData', p);
  if (r.success) {
    state.karakter = r.karakter || [];
    state.generus  = r.generus  || [];
    state.evaluasi = r.evaluasi || [];
  } else {
    // fallback: fetch terpisah kalau getAllData belum ada di backend
    await Promise.all([loadKarakter(), loadGenerus()]);
  }
}

async function loadKarakter() {
  const r = await api('getKarakter');
  if (r.success) state.karakter = r.data || [];
}
async function loadGenerus() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  const r = await api('getGenerus', p);
  if (r.success) state.generus = r.data || [];
}
async function loadEvaluasi() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  const r = await api('getEvaluasi', p);
  if (r.success) state.evaluasi = r.data || [];
}
async function loadRekap() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  const r = await api('getRekap', p);
  if (r.success) state.rekap = r;
}

// ============================================================
// NAVIGATION (bottom-nav mobile + sidebar desktop)
// ============================================================
const ICONS = {
  materi: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  user:   '<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  rekap:  '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  logout: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  arrowRight: '<svg class="arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  arrowLeft:  '<svg class="icon-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>'
};

function buildNavigation() {
  const role = state.user.role;
  let items = [];
  if (role === 'admin') {
    items = [
      { id:'materi',   label:'Materi', icon:ICONS.materi },
      { id:'karakter', label:'Kelola', icon:ICONS.materi },
      { id:'user',     label:'User',   icon:ICONS.user },
      { id:'logout',   label:'Keluar', icon:ICONS.logout }
    ];
  } else if (role === 'kelompok') {
    items = [
      { id:'materi', label:'Materi', icon:ICONS.materi },
      { id:'rekap',  label:'Rekap',  icon:ICONS.rekap },
      { id:'logout', label:'Keluar', icon:ICONS.logout }
    ];
  } else if (role === 'desa' || role === 'daerah') {
    items = [
      { id:'rekap',  label:'Rekap',  icon:ICONS.rekap },
      { id:'materi', label:'Materi', icon:ICONS.materi },
      { id:'logout', label:'Keluar', icon:ICONS.logout }
    ];
  }

  // Bottom nav (mobile)
  const navDiv = document.getElementById('bottomNav');
  navDiv.innerHTML = '';
  items.forEach(item => {
    const b = document.createElement('button');
    b.innerHTML = `${item.icon}<span>${item.label}</span>`;
    b.dataset.tab = item.id;
    b.onclick = () => switchTab(item.id);
    navDiv.appendChild(b);
  });

  // Sidebar nav (desktop)
  const sideNav = document.getElementById('sidebarNav');
  sideNav.innerHTML = '';
  items.forEach(item => {
    const b = document.createElement('button');
    b.innerHTML = `${item.icon}<span>${item.label}</span>`;
    b.dataset.tab = item.id;
    b.onclick = () => switchTab(item.id);
    sideNav.appendChild(b);
  });
}

function switchTab(id) {
  document.querySelectorAll('.bottom-nav button, .sidebar-nav button')
    .forEach(b => b.classList.toggle('active', b.dataset.tab === id));

  const el = document.getElementById('tabContent');
  el.innerHTML = '<div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>';
  state.activeMateri = null;

  if (id === 'logout') { logout(); return; }

  const map = {
    'materi':   renderMateriPage,
    'karakter': renderAdminKarakter,
    'user':     renderAdminUser,
    'rekap':    renderRekapPage
  };
  const fn = map[id];
  if (fn) fn();
}

// ============================================================
// DAFTAR MATERI
// ============================================================
async function renderMateriPage() {
  const el = document.getElementById('tabContent');
  if (!state.karakter.length) {
    el.innerHTML = '<div class="white-card"><p>Belum ada materi.</p></div>';
    return;
  }
  let html = `<div class="materi-grid">`;
  state.karakter.forEach(k => {
    html += `
      <div class="materi-card-item" onclick="openMateri('${k.id}')">
        <div class="materi-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="materi-info">
          <h4>${esc(k.judul)}</h4>
          <p>${esc(k.pengertian)}</p>
        </div>
        ${ICONS.arrowRight}
      </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.scrollTop = 0;
}

// ============================================================
// DETAIL MATERI
// ============================================================
async function openMateri(id) {
  state.activeMateri = state.karakter.find(k => String(k.id) === String(id));
  if (!state.activeMateri) return;

  const el = document.getElementById('tabContent');
  const k = state.activeMateri;

  if (state.user.role === 'kelompok' && !state.evaluasi.length) await loadEvaluasi();

  // Konten utama (materi)
  const mainContent = `
    <div class="course-card">
      <div class="tag">Materi Pembelajaran</div>
      <h3>${esc(k.judul)}</h3>
    </div>
    <div class="white-card">
      <h4><svg class="icon-sm" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Pengertian</h4>
      <p>${esc(k.pengertian)}</p>

      ${k.video_url ? `
      <h4 style="margin-top:16px;"><svg class="icon-sm" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>Video Pembelajaran</h4>
      <div class="video-container"><iframe src="${esc(toEmbed(k.video_url))}" allowfullscreen loading="lazy"></iframe></div>` : ''}

      <h4 style="margin-top:20px;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px">
          <svg class="icon-sm" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Dalil-Dalil & Artinya
        </span>
        <div class="font-control">
          <button class="font-btn" onclick="changeFontSize(-2)" title="Perkecil">A-</button>
          <button class="font-btn" onclick="changeFontSize(2)" title="Perbesar">A+</button>
        </div>
      </h4>
      ${renderDalilTable(k)}

      <h4 style="margin-top:20px;"><svg class="icon-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Contoh Praktik</h4>
      ${renderPraktikTable(k)}

      <h4 style="margin-top:20px;"><svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Refleksi & Afirmasi</h4>
      <div style="background:#F8F9FA;padding:12px;border-radius:8px;font-size:12px;margin-bottom:8px;white-space:pre-wrap">${esc(k.refleksi)}</div>
      <p style="font-weight:600;color:var(--primary);font-size:12px">"${esc(k.afirmasi)}" (dibaca 3x)</p>

      <h4 style="margin-top:20px;"><svg class="icon-sm" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Menyimpulkan & Komitmen</h4>
      ${renderKesimpulan()}
    </div>`;

  // Side content (evaluasi) — desktop sidebar kanan, mobile di bawah
  const evalContent = state.user.role === 'kelompok' ? `
    <div class="white-card">
      <h4><svg class="icon-sm" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Evaluasi Materi Ini</h4>
      <div class="select-wrap">
        <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <select id="jenjang_${k.id}" onchange="renderEvalList('${k.id}')">
          <option value="">Pilih Jenjang</option>
          <option value="Caberawit">Caberawit</option>
          <option value="Pra Remaja">Pra Remaja</option>
          <option value="Remaja">Remaja</option>
          <option value="Pra Nikah">Pra Nikah</option>
        </select>
      </div>
      <div id="eval_list_${k.id}" class="eval-list">
        <p style="font-size:12px;color:var(--text-gray);text-align:center;padding:10px 0">Pilih jenjang untuk melihat daftar nama.</p>
      </div>
    </div>` : '';

  el.innerHTML = `
    <button class="back-btn" onclick="renderMateriPage()">${ICONS.arrowLeft} Kembali ke Daftar Materi</button>
    ${evalContent ? `
      <div class="detail-layout">
        <div class="detail-main">${mainContent}</div>
        <div class="detail-side">${evalContent}</div>
      </div>` : mainContent}
  `;
  el.scrollTop = 0;
}

function parseDalil(d) {
  if (!d) return { arab:'', arti:'' };
  const parts = String(d).split('\n\n');
  if (parts.length > 1) return { arab: parts[0], arti: parts[1].replace(/^"|"$/g,'') };
  const isArabic = /[\u0600-\u06FF]/.test(d);
  return isArabic ? { arab:d, arti:'' } : { arab:'', arti:d };
}

function renderDalilTable(k) {
  const arr = Array.isArray(k.dalil) ? k.dalil : (k.dalil ? [k.dalil] : []);
  if (!arr.length) return `<p style="font-size:12px;color:var(--text-gray)">Belum ada dalil.</p>`;
  return `
    <div class="dalil-list" id="dalilList">
      ${arr.map((d, i) => {
        const { arab, arti } = parseDalil(d);
        return `
          <div class="dalil-card">
            ${arr.length > 1 ? `<span class="dalil-num">Dalil ${i+1}</span>` : ''}
            ${arab ? `<div class="dalil-arab">${esc(arab)}</div>` : ''}
            ${arab && arti ? `<div class="dalil-divider"></div>` : ''}
            ${arti ? `<div class="dalil-arti">${esc(arti)}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

function changeFontSize(delta) {
  const list = document.getElementById('dalilList');
  if (!list) return;
  list.querySelectorAll('.dalil-arab').forEach(el => {
    const cur = parseFloat(window.getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(14, Math.min(40, cur + delta)) + 'px';
  });
}

function renderPraktikTable(k) {
  const salah = k.contoh_salah || [];
  const benar = k.contoh_benar || [];
  const n = Math.max(salah.length, benar.length);
  if (!n) return `<table class="praktik-table"><tr><th>❌ Salah</th><th>✅ Benar</th></tr><tr><td colspan="2" style="text-align:center;color:var(--text-gray)">Belum ada contoh</td></tr></table>`;
  return `<table class="praktik-table">
    <tr><th>❌ Salah</th><th>✅ Benar</th></tr>
    ${Array.from({length:n}).map((_,i)=>`<tr><td class="salah">${esc(salah[i]||'')}</td><td class="benar">${esc(benar[i]||'')}</td></tr>`).join('')}
  </table>`;
}

function renderKesimpulan() {
  return `
    <div style="font-size:12px;color:var(--text-dark);line-height:1.6">
      <p style="margin-bottom:8px">Generus melakukan penilaian diri dengan menuliskan hal-hal yang perlu diperbaiki dan langkah-langkah komitmen.</p>
      <textarea class="form-control" style="margin-top:10px;background:#FFF;border-color:#DDD;font-size:12px" rows="4" placeholder="Tuliskan komitmen & penilaian dirimu..."></textarea>
      <button class="btn-primary" style="padding:10px;font-size:12px" onclick="toast('Komitmen berhasil disimpan!')">Simpan Komitmen</button>
    </div>`;
}

function renderEvalList(karakterId) {
  const jenjang = document.getElementById(`jenjang_${karakterId}`).value;
  const container = document.getElementById(`eval_list_${karakterId}`);
  if (!jenjang) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-gray);text-align:center;padding:10px 0">Pilih jenjang untuk melihat daftar nama.</p>';
    return;
  }
  const list = state.generus.filter(g => g.jenjang === jenjang);
  if (!list.length) {
    container.innerHTML = '<p style="font-size:12px;color:var(--danger);text-align:center;padding:10px 0">Tidak ada generus di jenjang ini.</p>';
    return;
  }
  let html = '';
  list.forEach(g => {
    const ev = state.evaluasi.find(e => String(e.karakter_id)===String(karakterId) && String(e.generus_nama)===String(g.nama));
    const status = ev ? ev.status : 'Belum';
    const encodedNama = encodeURIComponent(g.nama);
    html += `
      <div class="eval-item">
        <span class="name">${esc(g.nama)}</span>
        <div class="actions">
          <button class="btn-sm ${status==='Sudah'?'btn-sudah':'btn-outline'}" onclick="setStatus('${karakterId}',decodeURIComponent('${encodedNama}'),'Sudah')">${status==='Sudah'?'✓ Sudah':'Sudah'}</button>
          <button class="btn-sm ${status==='Belum'?'btn-belum':'btn-outline'}" onclick="setStatus('${karakterId}',decodeURIComponent('${encodedNama}'),'Belum')">${status==='Belum'?'✗ Belum':'Belum'}</button>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

async function setStatus(karakter_id, nama, status) {
  const g = state.generus.find(x => x.nama === nama);
  if (!g) return;
  const payload = {
    karakter_id, generus_nama:nama, jenjang:g.jenjang,
    kelompok:g.kelompok, desa:g.desa, daerah:g.daerah || '',
    status, catatan:'', oleh:state.user.username
  };
  const r = await api('saveEvaluasi', payload);
  if (r.success) {
    toast(`${nama}: ${status}`);
    const idx = state.evaluasi.findIndex(e => String(e.karakter_id)===String(karakter_id) && String(e.generus_nama)===String(nama));
    if (idx >= 0) state.evaluasi[idx].status = status;
    else state.evaluasi.push({ karakter_id, generus_nama:nama, status, jenjang:g.jenjang, kelompok:g.kelompok, desa:g.desa });
    const selectEl = document.getElementById(`jenjang_${karakter_id}`);
    if (selectEl) renderEvalList(karakter_id);
  } else toast(r.message, true);
}

// ============================================================
// ADMIN — KELOLA KARAKTER
// ============================================================
function renderAdminKarakter() {
  const el = document.getElementById('tabContent');
  editingKarakter = null;
  el.innerHTML = `
    <div class="white-card">
      <h4 style="justify-content:space-between">
        <span>Kelola Materi Karakter</span>
        <button class="btn-sm btn-sudah" onclick="showKarakterForm()">+ Tambah</button>
      </h4>
      <div id="karakterListContainer"></div>
    </div>
    <div id="karakterFormContainer"></div>`;
  renderKarakterList();
}

function renderKarakterList() {
  const container = document.getElementById('karakterListContainer');
  if (!container) return;
  if (!state.karakter.length) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-gray);text-align:center;padding:20px 0">Belum ada materi. Klik "+ Tambah".</p>';
    return;
  }
  container.innerHTML = `
    <div class="table-responsive">
      <table class="data-table">
        <tr><th>#</th><th>Judul</th><th>Dalil</th><th>Contoh</th><th>Aksi</th></tr>
        ${state.karakter.map((k,i)=>`
          <tr>
            <td>${k.urutan||i+1}</td>
            <td><strong>${esc(k.judul)}</strong></td>
            <td>${(k.dalil||[]).length}</td>
            <td>${(k.contoh_salah||[]).length}</td>
            <td style="white-space:nowrap">
              <button class="btn-sm btn-sudah" onclick="editKarakter('${k.id}')">Edit</button>
              <button class="btn-sm btn-belum" onclick="hapusKarakter('${k.id}')">Hapus</button>
            </td>
          </tr>`).join('')}
      </table>
    </div>`;
}

function editKarakter(id) {
  editingKarakter = state.karakter.find(k => String(k.id) === String(id));
  if (!editingKarakter) return;
  showKarakterForm(editingKarakter);
}

function showKarakterForm(k = null) {
  editingKarakter = k;
  const isEdit = !!k;
  const data = k || {
    judul:'', pengertian:'', dalil:[], video_url:'',
    contoh_salah:[], contoh_benar:[], refleksi:'', afirmasi:'', urutan: state.karakter.length+1
  };

  const container = document.getElementById('karakterFormContainer');
  container.innerHTML = `
    <div class="white-card" style="border:2px solid var(--primary)">
      <h4>${isEdit?'✏️ Edit Karakter':'➕ Tambah Karakter Baru'}</h4>

      <div class="form-row-2">
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Judul</label>
          <input id="f_judul" class="form-control" value="${esc(data.judul)}" placeholder="cth: Akhlakul Karimah">
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Urutan</label>
          <input id="f_urutan" type="number" class="form-control" value="${data.urutan||1}">
        </div>
      </div>

      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Pengertian</label>
      <textarea id="f_pengertian" class="form-control" rows="3" placeholder="Pengertian materi...">${esc(data.pengertian)}</textarea>

      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Video URL (opsional)</label>
      <input id="f_video" class="form-control" value="${esc(data.video_url)}" placeholder="https://youtu.be/...">

      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Dalil-Dalil</label>
      <div id="dalilList" class="dynamic-list"></div>
      <button class="btn-sm btn-outline" style="margin-bottom:12px" onclick="addDalilRow()">+ Tambah Dalil</button>

      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Contoh Praktik (Salah ↔ Benar)</label>
      <div id="contohList" class="dynamic-list"></div>
      <button class="btn-sm btn-outline" style="margin-bottom:12px" onclick="addContohRow()">+ Tambah Baris Contoh</button>

      <div class="form-row-2">
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Refleksi</label>
          <textarea id="f_refleksi" class="form-control" rows="3" placeholder="Pertanyaan refleksi...">${esc(data.refleksi)}</textarea>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Afirmasi</label>
          <input id="f_afirmasi" class="form-control" value="${esc(data.afirmasi)}" placeholder="Insya Alloh saya mampu...">
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn-primary" style="flex:1;min-width:140px" onclick="saveKarakterSubmit(${isEdit?`'${k.id}'`:'null'})">${isEdit?'💾 Simpan Perubahan':'💾 Simpan'}</button>
        <button class="btn-primary" style="flex:0 0 auto;background:#EEE;color:var(--text-dark);box-shadow:none" onclick="cancelKarakterForm()">Batal</button>
      </div>
    </div>`;

  const dalilArr = data.dalil && data.dalil.length ? data.dalil : [''];
  dalilArr.forEach(d => addDalilRow(d));

  const salahArr = data.contoh_salah || [];
  const benarArr = data.contoh_benar || [];
  const rowCount = Math.max(salahArr.length, benarArr.length, 1);
  for (let i = 0; i < rowCount; i++) addContohRow(salahArr[i]||'', benarArr[i]||'');

  container.scrollIntoView({ behavior:'smooth', block:'start' });
}

function cancelKarakterForm() {
  document.getElementById('karakterFormContainer').innerHTML = '';
  editingKarakter = null;
}

function addDalilRow(value = '') {
  const list = document.getElementById('dalilList');
  if (!list) return;
  const idx = list.children.length;
  const div = document.createElement('div');
  div.className = 'dynamic-row';
  div.innerHTML = `
    <textarea class="form-control dalil-input" rows="4" style="flex:1;margin-bottom:0" placeholder="Dalil ${idx+1}. Teks Arab, ENTER 2x, lalu artinya.">${esc(value)}</textarea>
    <button class="btn-sm btn-belum remove-btn" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

function addContohRow(salah = '', benar = '') {
  const list = document.getElementById('contohList');
  if (!list) return;
  const div = document.createElement('div');
  div.className = 'dynamic-row';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;margin-bottom:6px;align-items:start';
  div.innerHTML = `
    <textarea class="form-control contoh-salah" rows="2" style="margin-bottom:0;font-size:12px" placeholder="❌ Salah...">${esc(salah)}</textarea>
    <textarea class="form-control contoh-benar" rows="2" style="margin-bottom:0;font-size:12px" placeholder="✅ Benar...">${esc(benar)}</textarea>
    <button class="btn-sm btn-belum remove-btn" style="height:100%" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

async function saveKarakterSubmit(id) {
  const judul = document.getElementById('f_judul').value.trim();
  if (!judul) { toast('Judul wajib diisi', true); return; }

  const dalil = Array.from(document.querySelectorAll('.dalil-input')).map(t=>t.value.trim()).filter(v=>v);
  const contohSalah = Array.from(document.querySelectorAll('.contoh-salah')).map(t=>t.value.trim());
  const contohBenar = Array.from(document.querySelectorAll('.contoh-benar')).map(t=>t.value.trim());

  const payload = {
    id: id || undefined,
    judul,
    pengertian: document.getElementById('f_pengertian').value.trim(),
    video_url: document.getElementById('f_video').value.trim(),
    dalil, contoh_salah:contohSalah, contoh_benar:contohBenar,
    refleksi: document.getElementById('f_refleksi').value.trim(),
    afirmasi: document.getElementById('f_afirmasi').value.trim(),
    urutan: Number(document.getElementById('f_urutan').value) || 1
  };

  const r = await api('saveKarakterForm', payload);
  if (r.success) {
    toast(r.message);
    await loadKarakter();
    document.getElementById('karakterFormContainer').innerHTML = '';
    renderKarakterList();
  } else toast(r.message, true);
}

async function hapusKarakter(id) {
  if (!confirm('Hapus materi ini?')) return;
  const r = await api('deleteKarakter', { id });
  if (r.success) {
    toast(r.message);
    await loadKarakter();
    renderKarakterList();
  } else toast(r.message, true);
}

// ADMIN — USER
// ============================================================
async function renderAdminUser() {
  const el = document.getElementById('tabContent');
  el.innerHTML = '<div style="text-align:center;padding:30px 0"><div class="spinner"></div></div>';
  const r = await api('getUser');
  const users = r.success ? r.data : [];

  el.innerHTML = `
    <div class="white-card">
      <h4>Tambah / Edit User</h4>
      <div class="form-row-2">
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Username</label>
          <input id="u_username" class="form-control" placeholder="Username">
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Password</label>
          <input id="u_password" class="form-control" placeholder="Password">
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Role</label>
          <select id="u_role" class="form-control">
            <option value="admin">Admin</option>
            <option value="kelompok">Kelompok</option>
            <option value="desa">Desa</option>
            <option value="daerah">Daerah</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Lokasi</label>
          <input id="u_lokasi" class="form-control" placeholder="Nama kelompok/daerah">
        </div>
        <div>
          <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Desa</label>
          <input id="u_desa" class="form-control" placeholder="Desa">
        </div>
      </div>
      <button class="btn-primary" onclick="saveUser()" style="margin-top:6px">Simpan User</button>
    </div>
    <div class="white-card">
      <h4>Daftar User (${users.length})</h4>
      <div class="table-responsive">
        <table class="data-table">
          <tr><th>Username</th><th>Role</th><th>Lokasi</th><th>Desa</th><th>Aksi</th></tr>
          ${users.map(u=>`
            <tr>
              <td><strong>${esc(u.username)}</strong></td>
              <td><span style="font-size:10px;font-weight:600;color:var(--primary)">${esc(u.role)}</span></td>
              <td>${esc(u.lokasi||'-')}</td>
              <td>${esc(u.desa||'-')}</td>
              <td style="white-space:nowrap">
                <button class="btn-sm btn-sudah" onclick='editUser(${JSON.stringify(u).replace(/'/g,"\\'")})'>Edit</button>
                <button class="btn-sm btn-belum" onclick="hapusUser('${esc(u.username)}')">Hapus</button>
              </td>
            </tr>`).join('')}
        </table>
      </div>
    </div>`;
}

function editUser(u) {
  document.getElementById('u_username').value = u.username || '';
  document.getElementById('u_password').value = '';
  document.getElementById('u_role').value = (u.role||'').toLowerCase() || 'kelompok';
  document.getElementById('u_lokasi').value = u.lokasi || '';
  document.getElementById('u_desa').value = u.desa || '';
  document.getElementById('tabContent').scrollTop = 0;
}

async function saveUser() {
  const payload = {
    username: document.getElementById('u_username').value.trim(),
    password: document.getElementById('u_password').value,
    role: document.getElementById('u_role').value,
    lokasi: document.getElementById('u_lokasi').value,
    desa: document.getElementById('u_desa').value
  };
  if (!payload.username) { toast('Username wajib', true); return; }
  const r = await api('saveUser', payload);
  if (r.success) { toast(r.message); renderAdminUser(); }
  else toast(r.message, true);
}

async function hapusUser(username) {
  if (!confirm('Hapus user ' + username + '?')) return;
  const r = await api('deleteUser', { username });
  if (r.success) { toast(r.message); renderAdminUser(); }
  else toast(r.message, true);
}

  const r = state.rekap.rekap || {};
  const scope = state.user.role === 'desa' ? 'Desa' : (state.user.role === 'daerah' ? 'Daerah' : 'Kelompok');

  el.innerHTML = `

        <div class="course-card" style="background:linear-gradient(135deg,#00D2FF 0%,#0084C7 100%)">

            <div><div style="font-size:24px;font-weight:700">${state.rekap.totalEvaluasi||0}</div><div style="font-size:10px;opacity:.8">Evaluasi Masuk</div></div>
          </div>
        </div>
        <div class="white-card">
          <h4>Sebaran Jenjang</h4>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            ${Object.entries(state.rekap.perJenjang||{}).map(([j,v])=>`
              <div style="background:#F8F9FA;padding:11px;border-radius:12px;text-align:center">
                <div style="font-size:18px;font-weight:700;color:var(--primary)">${v.total}</div>
                <div style="font-size:11px;color:var(--text-gray)">${esc(j)}</div>
